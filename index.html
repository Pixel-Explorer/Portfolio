<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Anirudh — Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;500;600;700&family=Climate+Crisis&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=time-machine-r02">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
        }
      }
    </script>
    <script src="./data/ledger-data.js"></script>
    <script>
      // Shim: some preview iframes return undefined from matchMedia(),
      // which makes gsap's MatchMedia helper throw on .addListener.
      try {
        const _mm = window.matchMedia ? window.matchMedia.bind(window) : null;
        const fallback = () => ({
          matches: false, media: "",
          addListener: () => {}, removeListener: () => {},
          addEventListener: () => {}, removeEventListener: () => {},
          dispatchEvent: () => false,
        });
        window.matchMedia = (q) => {
          let r = null;
          try { r = _mm ? _mm(q) : null; } catch (_) { r = null; }
          if (!r) return fallback();
          if (!r.addListener) r.addListener = (cb) => r.addEventListener?.("change", cb);
          if (!r.removeListener) r.removeListener = (cb) => r.removeEventListener?.("change", cb);
          return r;
        };
      } catch (e) { /* noop */ }
    </script>
  </head>
  <body class="theme-glass">
    <!-- Ambient gradient backdrop -->
    <div class="ambient-bg" aria-hidden="true">
      <div class="ambient-orb ambient-orb--a"></div>
      <div class="ambient-orb ambient-orb--b"></div>
      <div class="ambient-orb ambient-orb--c"></div>
    </div>

    <!-- Top navigation — minimal glass bar -->
    <header class="topnav glass">
      <a class="brand" href="#archive" aria-label="Anirudh Ledger Archive">
        <span class="brand-dot"></span>
        <span class="brand-text">
          <strong>Anirudh</strong>
          <small>Archive · 2009–now</small>
        </span>
      </a>
      <nav class="topnav-links" aria-label="Primary navigation">
        <button type="button" class="navlink active" data-view="archive">Archive</button>
        <button type="button" class="navlink" data-view="roles">Roles</button>
        <button type="button" class="navlink" data-view="clients">Clients</button>
      </nav>
      <div class="topnav-actions">
        <input id="searchInput" class="search-glass" type="search" placeholder="Search projects, roles, orgs…" aria-label="Search archive">
        <button class="iconbtn" id="prevEntry" type="button" title="Previous moment" aria-label="Previous moment">‹</button>
        <button class="iconbtn" id="nextEntry" type="button" title="Next moment" aria-label="Next moment">›</button>
      </div>
    </header>

    <!-- Timeline bar — Year Window is the PRIMARY control, top center -->
    <div class="timeline-bar">
      <div class="timeline-year-label" id="yearWindowLabel">1991</div>
      <div class="timeline-slider-wrap">
        <div class="year-range year-range--hero" id="yearRange">
          <div class="year-range-track" aria-hidden="true">
            <div class="year-range-fill" id="yearRangeFill"></div>
          </div>
          <input id="yearWindowStart" class="year-range-input" type="range" min="1991" max="2026" value="1991" step="1" aria-label="Window start year">
          <input id="yearWindowEnd"   class="year-range-input" type="range" min="1991" max="2026" value="2026" step="1" aria-label="Window end year">
        </div>
        <output id="yearWindowOutput" class="timeline-output">1991 – 2026</output>
      </div>
      <div class="timeline-year-label" id="yearWindowLabelEnd">2026</div>
    </div>

    <!-- Role filter pills — left-aligned, compact -->
    <div class="filter-bar">
      <div class="filter-pills" id="rolePills" role="tablist" aria-label="Filter by role">
        <button type="button" class="rolepill active" data-role="all">
          <span class="rolepill-dot" style="background:#fff"></span>
          All work
        </button>
        <!-- Role pills injected by JS -->
      </div>
    </div>

    <main>
      <section class="workspace">
        <!-- Floating left side: stats + density legend -->
        <aside class="sidepanel sidepanel--left glass" aria-label="Archive overview">
          <div class="sidepanel-section">
            <div class="stat-row">
              <div class="stat">
                <strong id="statEntries">0</strong>
                <span>Entries</span>
              </div>
              <div class="stat">
                <strong id="statYears">0</strong>
                <span>Age</span>
              </div>
              <div class="stat">
                <strong id="statTags">0</strong>
                <span>Roles</span>
              </div>
            </div>
          </div>

          <div class="sidepanel-section">
            <div class="section-head">
              <span>Tags</span>
              <button id="clearFilters" class="textbtn" type="button">Clear</button>
            </div>
            <div id="tagFilters" class="tag-cloud"></div>
          </div>
        </aside>

        <!-- Center: 3D stage -->
        <section class="map-stage" aria-label="Spatial archive">
          <div class="map-toolbar glass">
            <button id="toggleView" class="toolbtn" type="button">
              <span class="toolbtn-icon" aria-hidden="true">⊞</span>
              <span>2D view</span>
            </button>
            <button id="resetView" class="toolbtn" type="button">
              <span class="toolbtn-icon" aria-hidden="true">⟲</span>
              <span>Reset</span>
            </button>
          </div>
          <div class="terrain-stage" id="terrainStage">
            <div class="terrain-canvas" id="terrainCanvas" aria-hidden="true"></div>
            <div class="terrain-empty" id="terrainEmpty">
              <strong>Loading spatial archive</strong>
              <span>Building the chronology…</span>
            </div>
          </div>
          <div class="map-scroll" id="mapScroll">
            <div class="map-scale" id="mapScale">
              <div class="week-header" id="weekHeader"></div>
              <div class="year-grid" id="yearGrid"></div>
            </div>
          </div>
          <div class="hud-hint" aria-hidden="true">
            <span>Drag to pan · scroll to zoom · right-drag to orbit · click to inspect</span>
          </div>
        </section>

        <!-- Right: detail panel (hidden until selection) -->
        <aside class="detail-panel glass" id="detailPanel" aria-live="polite" aria-hidden="true">
          <button class="detail-close" id="detailClose" type="button" aria-label="Close detail">×</button>
          <div class="detail-empty">
            <span class="detail-mark"></span>
            <h2>Select a block</h2>
            <p>Click any prism to dive into a moment.</p>
          </div>
        </aside>
      </section>
    </main>

    <div class="tooltip" id="tooltip" role="status"></div>

    <!-- Full-screen project page overlay (Prezi-style "you are now inside the project") -->
    <div class="project-page" id="projectPage" aria-hidden="true">
      <button class="project-back" id="projectBack" type="button">
        <span aria-hidden="true">←</span> Back to archive
      </button>
      <button class="project-page-close" id="projectPageClose" type="button" aria-label="Close project">×</button>
      <div class="project-page-inner" id="projectPageInner"></div>
    </div>

    <!-- Nav-tab overlays (Roles / Firsts / Throughlines lists) -->
    <div class="nav-page" id="navPage" aria-hidden="true">
      <button class="nav-page-close" id="navPageClose" type="button" aria-label="Close">×</button>
      <div class="nav-page-inner" id="navPageInner"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script type="module" src="app.js?v=time-machine-r02"></script>
  </body>
</html>
