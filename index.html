<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Anirudh — Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=10">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
        }
      }
    </script>
    <script src="./data/ledger-data.js"></script>
  </head>
  <body class="theme-glass">
    <!-- Ambient gradient backdrop -->
    <div class="ambient-bg" aria-hidden="true">
      <div class="ambient-orb ambient-orb--a"></div>
      <div class="ambient-orb ambient-orb--b"></div>
      <div class="ambient-orb ambient-orb--c"></div>
    </div>

    <!-- Top navigation — minimal glass bar -->
    <header class="topnav glass">
      <a class="brand" href="#archive" aria-label="Anirudh Ledger Archive">
        <span class="brand-dot"></span>
        <span class="brand-text">
          <strong>Anirudh</strong>
          <small>Archive · 2009–now</small>
        </span>
      </a>
      <nav class="topnav-links" aria-label="Primary navigation">
        <button type="button" class="navlink active" data-view="archive">Archive</button>
        <button type="button" class="navlink" data-view="roles">Roles</button>
        <button type="button" class="navlink" data-view="firsts">Firsts</button>
        <button type="button" class="navlink" data-view="throughlines">Throughlines</button>
      </nav>
      <div class="topnav-actions">
        <input id="searchInput" class="search-glass" type="search" placeholder="Search projects, roles, orgs…" aria-label="Search archive">
        <button class="iconbtn" id="prevEntry" type="button" title="Previous moment" aria-label="Previous moment">‹</button>
        <button class="iconbtn" id="nextEntry" type="button" title="Next moment" aria-label="Next moment">›</button>
      </div>
    </header>

    <!-- Role filter pills row -->
    <div class="filter-bar">
      <div class="filter-pills" id="rolePills" role="tablist" aria-label="Filter by role">
        <button type="button" class="rolepill active" data-role="all">
          <span class="rolepill-dot" style="background:#fff"></span>
          All work
        </button>
        <!-- Role pills injected by JS -->
      </div>
      <div class="filter-meta">
        <strong id="activeSummary">All years</strong>
        <span id="visibleSummary">Loading…</span>
      </div>
    </div>

    <main>
      <section class="workspace">
        <!-- Floating left side: stats + density legend -->
        <aside class="sidepanel sidepanel--left glass" aria-label="Archive overview">
          <div class="sidepanel-section">
            <div class="stat-row">
              <div class="stat">
                <strong id="statEntries">0</strong>
                <span>Entries</span>
              </div>
              <div class="stat">
                <strong id="statYears">0</strong>
                <span>Years</span>
              </div>
              <div class="stat">
                <strong id="statTags">0</strong>
                <span>Roles</span>
              </div>
            </div>
          </div>

          <div class="sidepanel-section">
            <div class="section-head">
              <span>Depth</span>
              <output id="zoomOutput">100%</output>
            </div>
            <input id="zoomControl" class="range-glass" type="range" min="80" max="210" value="100">
          </div>

          <div class="sidepanel-section">
            <div class="section-head">
              <span>Tags</span>
              <button id="clearFilters" class="textbtn" type="button">Clear</button>
            </div>
            <div id="tagFilters" class="tag-cloud"></div>
          </div>
        </aside>

        <!-- Center: 3D stage -->
        <section class="map-stage" aria-label="Spatial archive">
          <div class="map-toolbar glass">
            <button id="toggleView" class="toolbtn" type="button">
              <span class="toolbtn-icon" aria-hidden="true">⊞</span>
              <span>2D view</span>
            </button>
            <button id="resetView" class="toolbtn" type="button">
              <span class="toolbtn-icon" aria-hidden="true">⟲</span>
              <span>Reset</span>
            </button>
          </div>
          <div class="terrain-stage" id="terrainStage">
            <div class="terrain-canvas" id="terrainCanvas" aria-hidden="true"></div>
            <div class="terrain-empty" id="terrainEmpty">
              <strong>Loading spatial archive</strong>
              <span>Building the chronology…</span>
            </div>
          </div>
          <div class="map-scroll" id="mapScroll">
            <div class="map-scale" id="mapScale">
              <div class="week-header" id="weekHeader"></div>
              <div class="year-grid" id="yearGrid"></div>
            </div>
          </div>
          <div class="hud-hint" aria-hidden="true">
            <span>Drag to pan · scroll to zoom · right-drag to orbit · click to inspect</span>
          </div>
        </section>

        <!-- Right: detail panel (hidden until selection) -->
        <aside class="detail-panel glass" id="detailPanel" aria-live="polite" aria-hidden="true">
          <button class="detail-close" id="detailClose" type="button" aria-label="Close detail">×</button>
          <div class="detail-empty">
            <span class="detail-mark"></span>
            <h2>Select a block</h2>
            <p>Click any prism to dive into a moment.</p>
          </div>
        </aside>
      </section>
    </main>

    <div class="tooltip" id="tooltip" role="status"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script type="module" src="app.js?v=11"></script>
  </body>
</html>
